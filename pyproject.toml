[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ================================================================
# PROJECT METADATA
# ================================================================

[project]
name        = "ml-benchmark-lab"
version     = "0.2.0"
description = "Research-grade ML benchmarking framework: classification, regression, unsupervised, SHAP explainability."
readme      = "README.md"
license     = {file = "LICENSE"}
authors     = [{name = "Mahat Ibrahim", email = "mahatibrahim@ihu.edu.tr"}]

requires-python = ">=3.10"

keywords = [
    "machine-learning",
    "benchmark",
    "classification",
    "regression",
    "clustering",
    "unsupervised",
    "explainability",
    "shap",
    "feature-importance",
    "hyperparameter-optimization",
    "cross-validation",
    "imbalanced-data",
    "statistical-testing",
    "reproducibility",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

# ── Runtime dependencies ──────────────────────────────────────────
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "xgboost>=2.0",
    "imbalanced-learn>=0.11",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

# ── Project URLs ──────────────────────────────────────────────────
[project.urls]
Homepage      = "https://github.com/mahatibrahim/ml-benchmark-lab"
Repository    = "https://github.com/mahatibrahim/ml-benchmark-lab"
Issues        = "https://github.com/mahatibrahim/ml-benchmark-lab/issues"
Changelog     = "https://github.com/mahatibrahim/ml-benchmark-lab/blob/main/CHANGELOG.md"

# ── Optional dependency groups ─────────────────────────────────────
[project.optional-dependencies]

# SHAP-based model explainability (TreeExplainer, LinearExplainer, KernelExplainer)
shap = ["shap>=0.44"]

# Advanced statistical post-hoc tests (Nemenyi, Bayesian comparison)
stats = ["scikit-posthocs>=0.7", "baycomp>=1.0"]

# Documentation build
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]

# Development tools — testing, linting, type checking
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

# Everything optional at once
all = [
    "ml-benchmark-lab[shap,stats]",
]

# ── CLI entry point ────────────────────────────────────────────────
[project.scripts]
ml-benchmark = "src.cli:main"

# ================================================================
# PACKAGE DISCOVERY
# ================================================================

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["ROADMAP.md", "py.typed"]

# ================================================================
# TOOL CONFIGURATION
# ================================================================

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-q"
markers      = ["integration: slow end-to-end tests (deselect with -m 'not integration')"]

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version       = "3.10"
ignore_missing_imports = true
warn_unused_ignores  = true

[tool.coverage.run]
source  = ["src"]
omit    = ["src/cli.py"]
branch  = true

[tool.coverage.report]
show_missing   = true
skip_covered   = false
exclude_lines  = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
